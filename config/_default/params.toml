[homepage]
  onlyPostsInHomePage = false
  homePageLogo=true
  homePageTitle="JOHN DOE"
  homePageTagLine="Welcome to my website"
  homePageLogoPath='images/avatar.png' # you must either choose a logo or a cover image for the homepage if it is not a posts-main homepage. Selecting both will not work
  homePageAbout="Hi! I'm John Doe, a passionate blogger and portfolio creator. Explore my latest posts and projects here."
 
  homePageCoverPath='images/img_forest.jpg'
  homePageCoverTitle="Welcome to our blog and portfolio."
  homePageCoverTagLine="Discover insights, stories, and ideas that inspire. Join our community of readers exploring the latest trends and timeless wisdom.SUGAM"
  homePageSummaryLength=500
  homePagePostDate=false        
  dateFormat= "2 Jan 2006"
  showSocialLinksHome=true

[fonts]
  # siteFont='Georgia, Times New Roman, Monotype Corsiva'
  siteFont="UnifrakturMaguntia, serif"

[social]
  facebook = 'https://facebook.com/yourpage'
  x = 'https://x.com/yourhandle'
  # instagram = 'https://instagram.com/yourhandle'
  # linkedin = 'https://linkedin.com/in/yourprofile'
  # youtube = 'https://youtube.com/@yourchannel'
  # tiktok = 'https://tiktok.com/@yourhandle'
  github = 'https://github.com/yourusername'
  # reddit = 'https://reddit.com/u/yourusername'
  # pinterest = 'https://pinterest.com/yourhandle'
  # snapchat = 'https://snapchat.com/add/yourhandle'
  # discord = 'https://discord.gg/yourinvite'
  # twitch = 'https://twitch.tv/yourchannel'
  # telegram = 'https://t.me/yourhandle'
  # whatsapp = 'https://wa.me/yourphonenumber'
  # mastodon = 'https://mastodon.social/@yourhandle'
  bluesky = 'https://bsky.app/profile/yourhandle'
  # threads = 'https://threads.net/@yourhandle'
  # medium = 'https://medium.com/@yourhandle'

[theme]
  showDarkModeToggle=true
  showSearchIcon=true
  showGoToTop=true
  darkModeColor='#333333' # main background colors
  # lightModeColor='white' # #e0dedeff
  lightModeColor="#f5f5dc"
  darkModeLinkColor='#CCCCCC'  # link colors
  lightModeLinkColor='#00e'
  heroSectionColor='white'  #  heroSectionColor='#e0dedeff'
  darkHeroSectionColor="black"
  lightModeButton = "#007bff"
  lightModeButtonText = "#ffffff"
  lightModeButtonAlt = "transparent"
  lightModeButtonAltText = "#007bff"
  darkModeButton = "#0d6efd"
  darkModeButtonText = "#ffffff"
  darkModeButtonAlt = "transparent"
  darkModeButtonAltText = "#4d9aff"


[toc]
  numberingInTOC=true
  numberingInPost=false

[posts]
  readingSpeed=212
  showFrontMatter=true
  showDate=true
  showWordCount=true
  showAuthors=true
  showTags=true
  showCategories=true
  showReadingTime=true
  dateFormat="2 Jan 2006"
  showTagCloud=false
  showCategoryCloud=false
  showAuthorCloud=false
[rss]
  showRSS=false

[about]
  showSocialLinksPage=true

[sections]
  showDate=true
  showTags=false
  showCategories=true
  showAuthors=false
  showCoverImage=false
  showSummary=false
  showReadMore=false
  summaryLength=500
  dateFormat="2006-01-02"

 [slideshow]
  maxSize=20 

  [giscus]
enable=true
src="https://giscus.app/client.js"
  dataRepo="psugam/sans-theme"
        dataRepoId="R_kgDOQHNo3Q"
        dataCategory="Announcements"
        dataCategoryId="DIC_kwDOQHNo3c4CxQcB"
        dataMapping="pathname"
        dataStrict="0"
        dataReactionsEnabled="1"
        dataEmitMetadata="0"
        dataInputPosition="bottom"
        dataTheme="preferred_color_scheme"
        dataLang="en"
        dataLoading="lazy"
        crossorigin="anonymous"


