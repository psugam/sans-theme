<style>
     
    .search-icon-btn {

    .search-icon-btn svg {

    .search-overlay {
        position: fixed;
        top: 0;

    .search-close {

        display: flex;

    }

    }

    .search-close::before,

        position: absolute;
        width: 20px;
        height: 2px;
        background: #000000;
        transition: background 0.3s ease;
    }

    .search-close:hover::before,
    .search-close:hover::after {
        background: #ffffff;
    }

    .search-close::before {
        transform: rotate(45deg);
    }

    .search-close::after {
        transform: rotate(-45deg);
    }

     
    .search-input-wrapper {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
    }

        flex: 1;
        display: flex;

        background: #ffffff;
        border: 2px solid #000000;
        border-radius: 8px;
        padding: 12px 16px;
        gap: 10px;
    }

        flex: 1;
        border: none;

        color: #000000;

    }

    }

        padding: 4px;

        position: absolute;
        width: 16px;
        height: 2px;

    }

    }

    .clear-btn:hover::before,

    }

    .search-btn {

        color: #ffffff;
        border: 2px solid #000000;

<button class="search-icon-btn" id="searchIconBtn" aria-label="Search">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
    </svg>
</button>


<div class="search-overlay" id="searchOverlay">
    <div class="search-container">
        <button class="search-close" id="searchClose" aria-label="Close search"></button>
        
        <div class="search-input-wrapper">
            <div class="search-input-box">
                <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
                <button class="clear-btn" id="clearBtn" aria-label="Clear search"></button>
            </div>
            <button class="search-btn" id="performSearch">Search</button>
        </div>

        <div class="search-results" id="searchResults"></div>
    </div>
</div>


<script src="/pagefind/pagefind-ui.js"></script>
<div id="search"></div>

<script>
    window.addEventListener('DOMContentLoaded', (event) => {
        
        new PagefindUI({ 
            element: "#search", 
            showSubResults: true 
        });

        
        const searchOverlay = document.getElementById('searchOverlay');
        const searchIconBtn = document.getElementById('searchIconBtn');
        const searchClose = document.getElementById('searchClose');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const performSearchBtn = document.getElementById('performSearch');
        const searchResults = document.getElementById('searchResults');

        
        searchIconBtn.addEventListener('click', () => {
            searchOverlay.classList.add('active');
            searchInput.focus();
        });

        
        searchClose.addEventListener('click', closeSearch);
        searchOverlay.addEventListener('click', (e) => {
            if (e.target === searchOverlay) {
                closeSearch();
            }
        });

        function closeSearch() {
            searchOverlay.classList.remove('active');
            searchInput.value = '';
            clearBtn.classList.remove('active');
            searchResults.innerHTML = '';
        }

        
        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) {
                clearBtn.classList.add('active');
            } else {
                clearBtn.classList.remove('active');
            }
        });

        
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.remove('active');
            searchResults.innerHTML = '';
            searchInput.focus();
        });

        
        performSearchBtn.addEventListener('click', performSearch);

        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch() {
            const query = searchInput.value.trim();
            
            if (!query) {
                searchResults.innerHTML = '<div class="no-results">Please enter a search term</div>';
                return;
            }

            searchResults.innerHTML = '<div class="no-results">Searching...</div>';

            try {
                
                const pagefind = await import('/pagefind/pagefind.js');
                const results = await pagefind.search(query);
                
                if (results.results.length === 0) {
                    searchResults.innerHTML = '<div class="no-results">No results found</div>';
                    return;
                }

                
                const processedResults = await Promise.all(
                    results.results.map(async (result) => {
                        const data = await result.data();
                        return {
                            title: data.meta.title || 'Untitled',
                            excerpt: data.excerpt,
                            url: data.url
                        };
                    })
                );

                displayResults(processedResults);
            } catch (error) {
                console.error('Search error:', error);
                searchResults.innerHTML = '<div class="no-results">An error occurred while searching</div>';
            }
        }

        function displayResults(results) {
            searchResults.innerHTML = results.map(result => `
                <div class="result-item" onclick="window.location.href='${result.url}'">
                    <div class="result-title">${result.title}</div>
                    <div class="result-excerpt">${result.excerpt}</div>
                    <div class="result-url">${result.url}</div>
                </div>
            `).join('');
        }

        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && searchOverlay.classList.contains('active')) {
                closeSearch();
            }
        });
    });
</script>

<script>
  const goToTopButton = document.getElementById("goToTopButton");
  window.onscroll = function () {
    scrollFunction();
  };
  function scrollFunction() {
    if (
      document.body.scrollTop > 200 ||
      document.documentElement.scrollTop > 200
    ) {
      goToTopButton.style.display = "block";
    } else {
      goToTopButton.style.display = "none";
    }
  }

  
  function goToTop() {
    window.scrollTo({ top: 0, behavior: "smooth" });
