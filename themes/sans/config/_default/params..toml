[homepage]
  onlyPostsInHomePage = false
  homePageTitle="SUGAM POKAHREL"
  homePageLogo=false
  homePageTagLine="Welcome to my website"
  homePageLogoPath='images/sugam.jpg'
  # you must either choose a logo or a cover image for the homepage if it is not a posts-main homepage. Selecting both will not work
  homePageCoverPath='images/img_forest.jpg'
  homePageCoverTitle="Welcome to our blog and portfolio."
  homePageCoverTagLine="Discover insights, stories, and ideas that inspire. Join our community of readers exploring the latest trends and timeless wisdom.SUGAM"
  homePageSummaryLength=500
  # Manage Posts show in homepage
  homePagePostDate=true


[social]
  facebook = 'https://facebook.com/yourpage'
  x = 'https://x.com/yourhandle'
  # instagram = 'https://instagram.com/yourhandle'
  # linkedin = 'https://linkedin.com/in/yourprofile'
  # youtube = 'https://youtube.com/@yourchannel'
  # tiktok = 'https://tiktok.com/@yourhandle'
  github = 'https://github.com/yourusername'
  # reddit = 'https://reddit.com/u/yourusername'
  # pinterest = 'https://pinterest.com/yourhandle'
  # snapchat = 'https://snapchat.com/add/yourhandle'
  # discord = 'https://discord.gg/yourinvite'
  # twitch = 'https://twitch.tv/yourchannel'
  # telegram = 'https://t.me/yourhandle'
  # whatsapp = 'https://wa.me/yourphonenumber'
  # mastodon = 'https://mastodon.social/@yourhandle'
  bluesky = 'https://bsky.app/profile/yourhandle'
  # threads = 'https://threads.net/@yourhandle'
  # medium = 'https://medium.com/@yourhandle'

[theme]
# main background colors
showDarkModeToggle=true
  darkModeColor='#333333'
  lightModeColor='white' # #e0dedeff
# link colors
  darkModeLinkColor='#CCCCCC'
  lightModeLinkColor='#00e'
   heroSectionColor='#e0dedeff'
   darkHeroSectionColor="black"

lightModeButton = "#007bff"
lightModeButtonText = "#ffffff"
lightModeButtonAlt = "transparent"
lightModeButtonAltText = "#007bff"

darkModeButton = "#0d6efd"
darkModeButtonText = "#ffffff"
darkModeButtonAlt = "transparent"
darkModeButtonAltText = "#4d9aff"


[toc]
  numberingInTOC=false
  numberingInPost=true

[posts]
  reading_speed=212
  showDate=true
  showWordCount=true
  showAuthors=true
  showTags=true
  showCategories=true
  showReadingTime=true
  dateFormat="2023-11-11"

[rss]
  showRSS=false