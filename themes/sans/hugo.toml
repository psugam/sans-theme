baseURL = 'https://example.org/'
languageCode = 'en-US'
title = 'My New Hugo Site'



[pagination]
  disableAliases = false
  pagerSize = 4
  path = 'page'
  
[taxonomies]
  tag = "tags"
  author = "authors"

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
defaultMarkdownHandler = "goldmark"
[goldmark]
  [Extensions]
    footnote = true
    
[markup]
  [markup.tableOfContents]
    endLevel = 5
    ordered = false
    startLevel = 2