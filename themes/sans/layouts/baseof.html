<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
    {{ if .Param "math" }}
    {{ partialCached "math.html" . }}
  {{ end }}
</head>
<!-- This one manages the whole page in every page.  -->
<body>
  <header>
    {{ partial "header.html" . }}
  </header>
  <main>
      {{ block "main" . }}{{ end }}
  </main>
  <footer>
    {{ partial "footer.html" . }}
    
  </footer>

</body>
</html>
