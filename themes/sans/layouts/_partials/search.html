
<style>
    /* Search Icon Button */
    .search-icon-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        background: #ffffff;
        border: 2px solid #000000;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: all 0.3s ease;
    }

    .search-icon-btn:hover {
        background: #000000;
    }

    .search-icon-btn svg {
        width: 20px;
        height: 20px;
        stroke: #000000;
        transition: stroke 0.3s ease;
    }

    .search-icon-btn:hover svg {
        stroke: #ffffff;
    }

    /* Search Overlay */
    .search-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.95);
        z-index: 9999;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding-top: 100px;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .search-overlay.active {
        display: flex;
        opacity: 1;
    }

    /* Search Container */
    .search-container {
        width: 90%;
        max-width: 700px;
        position: relative;
    }

    /* Close Button */
    .search-close {
        position: absolute;
        top: -50px;
        right: 0;
        width: 40px;
        height: 40px;
        background: transparent;
        border: 2px solid #000000;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .search-close:hover {
        background: #000000;
        transform: rotate(90deg);
    }

    .search-close::before,
    .search-close::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 2px;
        background: #000000;
        transition: background 0.3s ease;
    }

    .search-close:hover::before,
    .search-close:hover::after {
        background: #ffffff;
    }

    .search-close::before {
        transform: rotate(45deg);
    }

    .search-close::after {
        transform: rotate(-45deg);
    }

    /* Search Input Area */
    .search-input-wrapper {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
    }

    .search-input-box {
        flex: 1;
        display: flex;
        align-items: center;
        background: #ffffff;
        border: 2px solid #000000;
        border-radius: 8px;
        padding: 12px 16px;
        gap: 10px;
    }

    .search-input-box input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 18px;
        color: #000000;
        background: transparent;
    }

    .search-input-box input::placeholder {
        color: #666666;
    }

    .clear-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 4px;
        display: none;
        width: 24px;
        height: 24px;
        position: relative;
    }

    .clear-btn.active {
        display: block;
    }

    .clear-btn::before,
    .clear-btn::after {
        content: '';
        position: absolute;
        width: 16px;
        height: 2px;
        background: #000000;
        top: 50%;
        left: 50%;
    }

    .clear-btn::before {
        transform: translate(-50%, -50%) rotate(45deg);
    }

    .clear-btn::after {
        transform: translate(-50%, -50%) rotate(-45deg);
    }

    .clear-btn:hover::before,
    .clear-btn:hover::after {
        background: #666666;
    }

    .search-btn {
        background: #000000;
        color: #ffffff;
        border: 2px solid #000000;
        padding: 12px 32px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        white-space: nowrap;
    }

    .search-btn:hover {
        background: #ffffff;
        color: #000000;
    }

    /* Results Area */
    .search-results {
        max-height: calc(100vh - 250px);
        overflow-y: auto;
        padding-right: 10px;
    }

    .search-results::-webkit-scrollbar {
        width: 8px;
    }

    .search-results::-webkit-scrollbar-track {
        background: #f0f0f0;
        border-radius: 4px;
    }

    .search-results::-webkit-scrollbar-thumb {
        background: #000000;
        border-radius: 4px;
    }

    .search-results::-webkit-scrollbar-thumb:hover {
        background: #333333;
    }

    /* Result Item */
    .result-item {
        background: #ffffff;
        border: 2px solid #000000;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 15px;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .result-item:hover {
        box-shadow: 4px 4px 0px #000000;
        transform: translate(-2px, -2px);
    }

    .result-title {
        font-size: 20px;
        font-weight: 700;
        color: #000000;
        margin-bottom: 8px;
    }

    .result-excerpt {
        color: #333333;
        font-size: 15px;
        line-height: 1.6;
    }

    .result-url {
        color: #666666;
        font-size: 13px;
        margin-top: 8px;
    }

    .no-results {
        text-align: center;
        color: #666666;
        font-size: 18px;
        padding: 40px 20px;
    }

    /* Hide Pagefind default UI */
    #search {
        display: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .search-overlay {
            padding-top: 80px;
        }

        .search-close {
            top: -45px;
        }

        .search-input-wrapper {
            flex-direction: column;
        }

        .search-btn {
            width: 100%;
        }
    }
</style>

    <!-- Search Icon Button -->
<button class="search-icon-btn" id="searchIconBtn" aria-label="Search">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
    </svg>
</button>

<!-- Search Overlay -->
<div class="search-overlay" id="searchOverlay">
    <div class="search-container">
        <button class="search-close" id="searchClose" aria-label="Close search"></button>
        
        <div class="search-input-wrapper">
            <div class="search-input-box">
                <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
                <button class="clear-btn" id="clearBtn" aria-label="Clear search"></button>
            </div>
            <button class="search-btn" id="performSearch">Search</button>
        </div>

        <div class="search-results" id="searchResults"></div>
    </div>
</div>



<!-- Hidden Pagefind UI -->
<script src="{{ relURL "pagefind/pagefind-ui.js" }}"></script>
<div id="search"></div>

<script>
    window.addEventListener('DOMContentLoaded', (event) => {
        // Initialize Pagefind
        new PagefindUI({ 
            element: "#search", 
            showSubResults: true,
            bundlePath: "{{ relURL "pagefind/" }}"
        });

        // Get elements
        const searchOverlay = document.getElementById('searchOverlay');
        const searchIconBtn = document.getElementById('searchIconBtn');
        const searchClose = document.getElementById('searchClose');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const performSearchBtn = document.getElementById('performSearch');
        const searchResults = document.getElementById('searchResults');

        // Open search overlay
        searchIconBtn.addEventListener('click', () => {
            searchOverlay.classList.add('active');
            searchInput.focus();
        });

        // Close search overlay
        searchClose.addEventListener('click', closeSearch);
        searchOverlay.addEventListener('click', (e) => {
            if (e.target === searchOverlay) {
                closeSearch();
            }
        });

        function closeSearch() {
            searchOverlay.classList.remove('active');
            searchInput.value = '';
            clearBtn.classList.remove('active');
            searchResults.innerHTML = '';
        }

        // Show/hide clear button
        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) {
                clearBtn.classList.add('active');
            } else {
                clearBtn.classList.remove('active');
            }
        });

        // Clear search
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.remove('active');
            searchResults.innerHTML = '';
            searchInput.focus();
        });

        // Perform search on button click
        performSearchBtn.addEventListener('click', performSearch);

        // Perform search on Enter key
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch() {
            const query = searchInput.value.trim();
            
            if (!query) {
                searchResults.innerHTML = '<div class="no-results">Please enter a search term</div>';
                return;
            }

            searchResults.innerHTML = '<div class="no-results">Searching...</div>';

            try {
                // Use Pagefind search API
                const pagefind = await import('{{ relURL "pagefind/pagefind.js" }}');
                const results = await pagefind.search(query);
                
                if (results.results.length === 0) {
                    searchResults.innerHTML = '<div class="no-results">No results found</div>';
                    return;
                }

                // Process results
                const processedResults = await Promise.all(
                    results.results.map(async (result) => {
                        const data = await result.data();
                        return {
                            title: data.meta.title || 'Untitled',
                            excerpt: data.excerpt,
                            url: data.url
                        };
                    })
                );

                displayResults(processedResults);
            } catch (error) {
                console.error('Search error:', error);
                searchResults.innerHTML = '<div class="no-results">An error occurred while searching</div>';
            }
        }

        function displayResults(results) {
            searchResults.innerHTML = results.map(result => `
                <div class="result-item" onclick="window.location.href='${result.url}'">
                    <div class="result-title">${result.title}</div>
                    <div class="result-excerpt">${result.excerpt}</div>
                    <div class="result-url">${result.url}</div>
                </div>
            `).join('');
        }

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && searchOverlay.classList.contains('active')) {
                closeSearch();
            }
        });
    });
</script>
