{{ define "main" }}
<div class="individual-term-box">
  <h1>{{ .Title }}</h1>
  <!-- This is for individual pages inside the term. So, not for Tags but for specific Green , blue tags etc. -->
  


{{ $cover := "" }}
{{ $displayImage := true }}

{{ with .Params.taxonomy_image }}
  {{ $cover = $.Resources.GetMatch . }}  <!-- or use $.Resources.GetMatch if it’s a page bundle -->
{{ end }}

{{ if $cover }}
<div class="taxonomy_image">
  <img src="{{ $cover.RelPermalink }}" alt="{{ .Title }}">
</div>
{{ end }}



  {{ .Content }} 
  {{ range .Pages }}
   <!-- <div><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></div> -->
      <div>
<a href="{{ .RelPermalink }}" style="display:inline-block; margin-right:8px; font-size: large;">
  {{ .LinkTitle }}
</a>
</div>
  {{ end }}
</div>

{{ end }}
